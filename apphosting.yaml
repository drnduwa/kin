# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
env:
  - variable: CRON_SECRET
    secret: CRON_SECRET
  # Clé publique Web Push (paire « Current pair » de Firebase Cloud Messaging). Publique : pas un secret.
  - variable: NEXT_PUBLIC_VAPID_KEY
    value: BHEaJ7Dy5w0tUBMdj_7N5ei9UJp4G6gz2gz1JAcMXHiFIII2HwAqW2uPtRvK2OBY_Xu9L6iZ8-1CtJALAmYph28
    availability:
      - BUILD
      - RUNTIME
  # Serveur d'itinéraires OSRM du Mode Conduite (Cloud Run « osrm-kinshasa », voir infra/osrm/README.md).
  # Adresse publique, pas un secret. Sans cette variable, l'app retombe sur le serveur de démonstration d'OSRM.
  - variable: OSRM_URL
    value: https://osrm-kinshasa-196367644911.us-central1.run.app
    availability:
      - RUNTIME
